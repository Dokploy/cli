apiVersion: v1
kind: Organization
sshKeys:
  - name: deploy
    publicKey: ssh-ed25519 AAAA... deploy@example.com
    privateKey: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      ...
      -----END OPENSSH PRIVATE KEY-----
servers:
  - name: worker-1
    ipAddress: 203.0.113.10
    username: root
    sshKeyName: deploy
destinations:
  - name: backups
    provider: cloudflare
    accessKey: change-me
    secretAccessKey: change-me
    bucket: dokploy-backups
    region: auto
    endpoint: https://<account>.r2.cloudflarestorage.com
notifications:
  - name: alerts
    type: slack
    webhookUrl: https://hooks.slack.com/services/change-me
    channel: "#deploys"
    appDeploy: true
    appBuildError: true
vaultProviders:
  - name: infisical
    providerType: infisical
    clientId: change-me
    clientSecret: change-me
    projectId: change-me
    environmentSlug: prod
    assignments:
      - project: my-project
        environments: [production]
---
apiVersion: v1
kind: Project
name: my-project
description: My application stack
env: |
  LOG_LEVEL=info

environments:
  - name: production
    env: |
      API_URL=https://api.example.com
    applications:
      - name: web-api
        env: |
          LOG_LEVEL=${{project.LOG_LEVEL}}
          PUBLIC_URL=${{environment.API_URL}}
        gitProvider: my-github-app
        sourceType: github
        repository: api
        owner: my-org
        branch: main
        buildType: dockerfile
        dockerfile: Dockerfile
        replicas: 1
        autoDeploy: true
        domains:
          - host: api.example.com
            port: 3000
            https: true
            certificateType: letsencrypt
        mounts:
          - type: volume
            mountPath: /app/data
            volumeName: api-data
        schedules:
          - name: cleanup
            cronExpression: "0 2 * * *"
            command: rm -rf /tmp/cache

    compose:
      - name: monitoring
        sourceType: raw
        composeFile: |
          services:
            uptime:
              image: louislam/uptime-kuma:1

    postgres:
      - name: main-db
        dockerImage: postgres:16
        databaseName: myapp
        databaseUser: admin
        databasePassword: change-me

    redis:
      - name: cache
        dockerImage: redis:7
        databasePassword: change-me
